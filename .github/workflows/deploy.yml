name: Deploy to Production

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  GCP_REGION: asia-south1
  BACKEND_IMAGE: devops-backend
  FRONTEND_IMAGE: devops-frontend

jobs:
  # ==================== DEPLOY TO AWS ====================
  deploy-aws:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update ECS Backend Service
        run: |
          aws ecs update-service \
            --cluster devops-cluster \
            --service backend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Update ECS Frontend Service
        run: |
          aws ecs update-service \
            --cluster devops-cluster \
            --service frontend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Backend deployment
        run: |
          aws ecs wait services-stable \
            --cluster devops-cluster \
            --services backend-service \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Frontend deployment
        run: |
          aws ecs wait services-stable \
            --cluster devops-cluster \
            --services frontend-service \
            --region ${{ env.AWS_REGION }}

  # ==================== DEPLOY TO GCP ====================
  deploy-gcp:
    name: Deploy to GCP Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy devops-backend \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devops-repo/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8000 \
            --min-instances 2 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1

      - name: Get Backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe devops-backend --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy devops-frontend \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devops-repo/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port 3000 \
            --min-instances 2 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "NEXT_PUBLIC_API_URL=${{ steps.backend-url.outputs.url }}"

  # ==================== POST-DEPLOYMENT ====================
  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-aws, deploy-gcp]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| AWS ECS | ${{ needs.deploy-aws.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GCP Cloud Run | ${{ needs.deploy-gcp.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
